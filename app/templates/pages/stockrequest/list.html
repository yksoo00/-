{% extends 'layouts/base.html' %}
{% block content %}
<section class="page-head"><div><span class="eyebrow">REQUESTS</span><h1>입고 요청</h1><p>출고로 재고가 부족해지면 자동으로, 필요하면 직접 입고 요청을 등록합니다.</p></div></section>
<section class="panel">
  <div class="toolbar">
    <input id="requestSearch" class="search" placeholder="Code, 품명, 사이트, 사유로 검색">
    <input id="requestDate" type="date">
    <select id="requestStatus">
      <option value="">전체 상태</option>
      <option value="requested">요청됨</option>
      <option value="approved">승인완료</option>
      <option value="arrived">입고완료</option>
    </select>
  </div>
  <div class="table-wrap">
    <table id="requestTable">
      <thead><tr><th>일시</th><th>구분</th><th>Code</th><th>품명</th><th>사이트</th><th>수량</th><th>사유</th><th>요청자</th><th>상태</th><th>작업</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="requestMeta" class="result-meta"></div>
  <div id="requestPagination" class="pagination"></div>
</section>
{% endblock %}
{% block scripts %}<script src="{{url_for('static',filename='js/stockrequest.js')}}"></script>{% endblock %}
